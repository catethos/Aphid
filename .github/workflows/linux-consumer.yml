name: Current source with reviewed Linux bundles
on:
  workflow_dispatch:
    inputs:
      retain_source:
        description: Retain passing Hex source package and evidence for seven days
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '29.0.4'
          elixir-version: '1.20.0'
      - name: Install consumer proof prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap binutils
          mix local.hex --force
      - name: Verify current package with exact reviewed native archive
        env:
          GH_TOKEN: ${{ github.token }}
          APHID_TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          python3 -u scripts/linux_consumer_ci.py --target "$APHID_TARGET" --work "$RUNNER_TEMP/aphid-current-consumer" 2>&1 | tee "$RUNNER_TEMP/current-consumer.log"
      - name: Retain passing source package for cross-platform review
        if: ${{ success() && inputs.retain_source && matrix.target == 'x86_64-linux-gnu' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: combined-source-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/aphid-current-consumer/aphid-0.1.0-dev-combined.tar
            ${{ runner.temp }}/aphid-current-consumer/fresh/inputs.json
            ${{ runner.temp }}/current-consumer.log
# Native bundles and bundled-ERTS release archives are not uploaded by this workflow.
