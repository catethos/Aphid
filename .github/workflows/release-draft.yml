name: Prepare reviewed Linux draft release
on:
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Successful Linux qualification run pinned in the tagged source catalog
        type: string
        required: true
      consumer_run:
        description: Successful combined consumer run pinned in version-specific review record
        type: string
        required: true
      reviewed:
        description: Owner has reviewed the exact assets, notices and release boundaries
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  draft:
    if: ${{ inputs.reviewed && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Retrieve the selected qualification
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.qualification_run }}
          CONSUMER_RUN_ID: ${{ inputs.consumer_run }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CONSUMER_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONSUMER_RUN_ID" > "$RUNNER_TEMP/consumer.json"
          gh run download "$CONSUMER_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "combined-source-$CONSUMER_RUN_ID" --dir "$RUNNER_TEMP/consumer"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/qualification.json"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "validation-*-$RUN_ID-*" --dir "$RUNNER_TEMP/qualified"
      - name: Verify source-pinned identities and stage exact assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release_assets.py --run "$RUNNER_TEMP/qualification.json" --artifacts "$RUNNER_TEMP/qualified" --output "$RUNNER_TEMP/release" --tag "$TAG" --consumer-run "$RUNNER_TEMP/consumer.json" --consumer-artifacts "$RUNNER_TEMP/consumer"
      - name: Create a draft prerelease for owner review
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP/release/"* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --title "Aphid $TAG — native review draft" --notes-file "docs/releases/$TAG.md"
