name: Linux native qualification
on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Check isolation and small NIF relocation only; no engine qualification
        type: boolean
        default: false
      retain_validation:
        description: Retain passing validation bundles for review (owner approval required)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  linux:
    name: ${{ matrix.target }} (${{ inputs.preflight_only && 'preflight' || 'full' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux-gnu
            zig_arch: x86_64-linux
            zig_sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-gnu
            zig_arch: aarch64-linux
            zig_sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '29.0.4'
          elixir-version: '1.20.0'
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build perl binutils patchelf bubblewrap
      - name: Install checksum-pinned Zig in job directory
        env:
          ZIG_ARCH: ${{ matrix.zig_arch }}
          ZIG_SHA256: ${{ matrix.zig_sha256 }}
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/0.16.0/zig-${ZIG_ARCH}-0.16.0.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Check routing without compiling
        run: python3 scripts/source_routing_checks.py --destination "$RUNNER_TEMP/routing"
      - name: Verify consumer isolation before building
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from linux_sandbox import probe
          work = Path(os.environ['RUNNER_TEMP']) / 'isolation-probe'
          work.mkdir()
          probe(work, [])
          PY
      - name: Check small NIF relocation without an engine build
        if: ${{ inputs.preflight_only }}
        env:
          APHID_TARGET: ${{ matrix.target }}
        run: python3 -u scripts/linux_ci.py --target "$APHID_TARGET" --work "$RUNNER_TEMP/aphid-preflight" --toolchain-only
      - name: Build private locked sources and run native and BEAM suites
        if: ${{ !inputs.preflight_only }}
        env:
          APHID_TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          python3 -u scripts/linux_ci.py --target "$APHID_TARGET" --work "$RUNNER_TEMP/aphid-linux" 2>&1 | tee "$RUNNER_TEMP/linux-qualification.log"
      - name: Retain passing validation bundles for seven days
        if: ${{ success() && inputs.retain_validation && !inputs.preflight_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/aphid-linux-distribution/packaged/aphid-0.1.2-dev-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/aphid-linux-distribution/packaged/identity.json
            ${{ runner.temp }}/aphid-linux-distribution/packaged/elf-audit.json
            ${{ runner.temp }}/aphid-linux-distribution/aphid-0.1.2-dev-linux-validation.tar
            ${{ runner.temp }}/aphid-linux-distribution/package-identity.json
            ${{ runner.temp }}/aphid-linux-distribution/consumer-proof/inputs.json
            ${{ runner.temp }}/linux-qualification.log
